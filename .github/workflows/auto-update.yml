name: Stündliche Wetter-Aktualisierung

on:
  schedule:
    - cron: '0 * * * *'  # Läuft jede Stunde zur Minute 0
  workflow_dispatch:      # Ermöglicht auch den manuellen Start über die GitHub-Oberfläche

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren (falls nötig)
        run: |
          python -m pip install --upgrade pip
          # Falls du requests o.ä. nutzt, hier ergänzen: pip install requests

      - name: Generator-Skript ausführen
        run: python generator.py

      - name: Änderungen speichern und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automatisches stündliches Update der Wetterdaten" || exit 0
          git push

      - name: Per FTP auf webseiten-mueller.de hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: s76.goserver.host                                                 
          username: web263                          
          password: ${{ secrets.FTP_PASSWORD }}    
          local-dir: ./                            
          server-dir: /home/www/webseiten-mueller.de/veritas-atmo/              
          include: 'index.html'                     